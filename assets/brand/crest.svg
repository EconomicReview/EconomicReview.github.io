<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 540" role="img" aria-label="Crest of The Economic Review at William &amp; Mary: a shield bearing a royal crown, a Jupiter mark, and a gold sun on a black chevron field">
  <defs>
    <path id="shield" d="M 40 44 Q 40 30 54 30 H 386 Q 400 30 400 44 V 250 C 400 385 320 465 220 512 C 120 465 40 385 40 250 Z"/>
    <clipPath id="shield-clip"><use href="#shield"/></clipPath>
    <polygon id="ray" points="0,-84 6.5,-38 -6.5,-38"/>
  </defs>

  <use href="#shield" fill="#FFFFFF"/>

  <g clip-path="url(#shield-clip)">
    <!-- black field below the chevron -->
    <path d="M 220 302 L 470 448 L 470 560 L -30 560 L -30 448 Z" fill="#111311"/>
    <!-- green chevron band -->
    <path d="M -30 455 L 220 295 L 470 455" fill="none" stroke="#004E38" stroke-width="30"/>

    <!-- sun in splendour -->
    <g transform="translate(220,405)">
      <g fill="#B79257">
        <use href="#ray"/>
        <use href="#ray" transform="rotate(22.5)"/>
        <use href="#ray" transform="rotate(45)"/>
        <use href="#ray" transform="rotate(67.5)"/>
        <use href="#ray" transform="rotate(90)"/>
        <use href="#ray" transform="rotate(112.5)"/>
        <use href="#ray" transform="rotate(135)"/>
        <use href="#ray" transform="rotate(157.5)"/>
        <use href="#ray" transform="rotate(180)"/>
        <use href="#ray" transform="rotate(202.5)"/>
        <use href="#ray" transform="rotate(225)"/>
        <use href="#ray" transform="rotate(247.5)"/>
        <use href="#ray" transform="rotate(270)"/>
        <use href="#ray" transform="rotate(292.5)"/>
        <use href="#ray" transform="rotate(315)"/>
        <use href="#ray" transform="rotate(337.5)"/>
      </g>
      <circle r="42" fill="#C6A96B"/>
      <!-- face: calm, engraved style -->
      <g fill="none" stroke="#2A2415" stroke-width="2.5" stroke-linecap="round">
        <path d="M -20 -8 Q -13 -13 -6 -8"/>
        <path d="M 6 -8 Q 13 -13 20 -8"/>
        <path d="M -1 -4 L -1 10 M -4 12 Q -1 14 2 12"/>
        <path d="M -8 21 Q 0 24 8 21"/>
      </g>
      <ellipse cx="-13" cy="-6" rx="3.6" ry="2.5" fill="#2A2415"/>
      <ellipse cx="13" cy="-6" rx="3.6" ry="2.5" fill="#2A2415"/>
    </g>
  </g>

  <!-- shield border -->
  <use href="#shield" fill="none" stroke="#004E38" stroke-width="11"/>

  <!-- royal crown: pearled arches, cross pattée, fleurs, band, pedestal -->
  <g transform="translate(140,150)" fill="#004E38">
    <!-- arches -->
    <path d="M -54 38 C -52 -14 -18 -30 0 -30 C 18 -30 52 -14 54 38"
          fill="none" stroke="#004E38" stroke-width="9.5"/>
    <!-- pearls along the arches -->
    <circle cx="-44" cy="0" r="3"/>
    <circle cx="-30" cy="-13" r="3"/>
    <circle cx="-15" cy="-22" r="3"/>
    <circle cx="15" cy="-22" r="3"/>
    <circle cx="30" cy="-13" r="3"/>
    <circle cx="44" cy="0" r="3"/>
    <!-- orb and cross at top -->
    <circle cx="0" cy="-38" r="8"/>
    <rect x="-2.75" y="-72" width="5.5" height="22" rx="1"/>
    <rect x="-10" y="-65" width="20" height="5.5" rx="1"/>
    <!-- cross pattée centre, on the band -->
    <path d="M -4 2 L -4 12 L -14 12 L -14 21 L -4 21 L -4 32 L 4 32 L 4 21 L 14 21 L 14 12 L 4 12 L 4 2 Z"/>
    <!-- fleurs-de-lis, tilted outward -->
    <g transform="translate(-44,12) rotate(-20)">
      <ellipse cx="0" cy="0" rx="6.5" ry="14"/>
      <ellipse cx="-11" cy="9" rx="5" ry="10" transform="rotate(-38 -11 9)"/>
      <ellipse cx="11" cy="9" rx="5" ry="10" transform="rotate(38 11 9)"/>
    </g>
    <g transform="translate(44,12) rotate(20)">
      <ellipse cx="0" cy="0" rx="6.5" ry="14"/>
      <ellipse cx="-11" cy="9" rx="5" ry="10" transform="rotate(-38 -11 9)"/>
      <ellipse cx="11" cy="9" rx="5" ry="10" transform="rotate(38 11 9)"/>
    </g>
    <!-- pearls on the band -->
    <circle cx="-52" cy="31" r="3.8"/>
    <circle cx="-39" cy="31" r="3.8"/>
    <circle cx="-26" cy="31" r="3.8"/>
    <circle cx="-13" cy="31" r="3.8"/>
    <circle cx="0" cy="31" r="3.8"/>
    <circle cx="13" cy="31" r="3.8"/>
    <circle cx="26" cy="31" r="3.8"/>
    <circle cx="39" cy="31" r="3.8"/>
    <circle cx="52" cy="31" r="3.8"/>
    <!-- band -->
    <rect x="-56" y="36" width="112" height="16" rx="4"/>
    <!-- detached pedestal bar -->
    <rect x="-62" y="62" width="124" height="14" rx="7"/>
  </g>

  <!-- Jupiter mark -->
  <g fill="none" stroke="#004E38" stroke-linecap="butt" transform="translate(300,150)">
    <path d="M -16 -92 C 30 -102 58 -76 55 -42 C 52 -14 22 4 -34 14" stroke-width="18"/>
    <path d="M -50 20 L 88 20" stroke-width="16"/>
    <path d="M 58 -16 L 58 80" stroke-width="16"/>
  </g>
</svg>
