# The 2026–27 calendar. Update each semester when the board sets new dates.
#
# Fields:
#   date     — machine date used ONLY for sorting and past/future comparison.
#              For fuzzy entries ("late September") it is an internal sort key
#              and is never displayed.
#   datetime — the value for <time datetime="">. Month precision ("2026-09")
#              is valid HTML for dates the board has not pinned down.
#   display  — exactly what readers see.
#   type     — deadline | decision | event
#   track    — research | perspectives | all | org  (org = internal lifecycle,
#              shown only on the Join page)
- id: call-released
  label: "Call for submissions released"
  date: 2026-09-11
  datetime: "2026-09-11"
  display: "11 September 2026"
  type: event
  track: all
